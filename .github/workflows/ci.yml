name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    permissions:
      contents: write   # publish the .firm as a release asset

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: git config --global safe.directory '*'

      - name: Fix apt sources
        run: |
          apt-get update
          apt-get -y install dirmngr
          echo 'deb http://us.archive.ubuntu.com/ubuntu/ bionic main' >> /etc/apt/sources.list
          apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 3B4FE6ACC0B21F32
          apt-get update

      - name: Install and update packages
        run: |
          apt-get -y install python3 python3-pip p7zip-full libarchive13
          python3 --version
          python3 -m pip install --break-system-packages --upgrade pip setuptools
          python3 -m pip install --break-system-packages cryptography git+https://github.com/TuxSH/firmtool.git

      - name: Build Project
        run: make release -j$(nproc)

      - name: Prepare build artifact
        working-directory: release
        run: |
          ZIPNAME=$(ls GodMode9-*.zip)
          rm $ZIPNAME
          # ship the firm under its own name so it can sit next to the stock GodMode9 in luma/payloads
          mv GodMode9.firm GodMode9_RefFix.firm
          mv GodMode9.firm.sha GodMode9_RefFix.firm.sha
          echo "OUTNAME=GodMode9_RefFix-${ZIPNAME#GodMode9-}" | sed 's/\.zip$//' >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTNAME }}
          path: release/*
          if-no-files-found: error

      - name: Publish GodMode9_RefFix.firm as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/reference-fix'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reffix-${{ github.run_number }}
          name: GodMode9_RefFix build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release/GodMode9_RefFix.firm
          body: |
            Cartridge Fixer with "Fix with reference image" (branch reference-fix, commit ${{ github.sha }}).
            Copy GodMode9_RefFix.firm to SD:/luma/payloads/.
            Always-current download: https://github.com/${{ github.repository }}/releases/latest/download/GodMode9_RefFix.firm
